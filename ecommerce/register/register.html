<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./register.css">
</head>
<body>
    <div class="container">
        <h1>Create Account</h1>
        <p class="subtitle">Please fill in your details to register</p>
        <form id="formContainer">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <label>Mobile Number</label>
            <input type="tel" id="mobile" placeholder="Enter your mobile number" required>

            <button type="submit">Register</button>
        </form>

        <p class="signin">Already have an account?
            <a href="../login/login.html">SignIn</a>
        </p>
        <p class="footer">@2026 All rights reserved.</p>
    </div>


    
<script src="./register.js"></script>
</body>
</html>
